ket .ticket-top{display:flex;justify-content:space-between}.ticket h3{font-size:14px;margin:10px 0}.ticket ul{padding-left:18px;color:#d7d4cf;font-size:11px;line-height:1.8}.ticket button{width:100%;margin-top:8px}.mobile-toggle{display:none}.nav-scrim{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#18181b;color:#fff;border-radius:10px;padding:12px 15px;font-size:12px;box-shadow:0 15px 35px rgba(0,0,0,.2);z-index:50}.modal-backdrop{position:fixed;inset:0;background:rgba(24,24,27,.25);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:40}.modal{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 35px -10px rgba(24,24,27,.12);width:min(560px,calc(100% - 32px));padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{font-size:18px;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr)}.dish-grid{grid-template-columns:repeat(2,1fr)}.kds-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){:root{--sidebar:0px}.sidebar{transform:translateX(-100%);transition:.2s;width:250px;box-shadow:10px 0 30px rgba(0,0,0,.08)}.sidebar.open{transform:none}.nav-scrim.open{display:block;position:fixed;inset:0;background:rgba(24,24,27,.22);backdrop-filter:blur(2px);z-index:9}.main{margin-left:0;width:100%}.mobile-toggle{display:inline-flex}.topbar{padding:0 14px;height:64px}.topbar h1{font-size:16px}.content{padding:16px}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.hero{padding:14px}.hero-image{min-height:560px;padding:26px}.hero h1{font-size:34px}.customer-nav{padding:0 14px}.customer-links{display:none}.customer-section{padding:38px 14px}.customer-section h2{font-size:24px}.dish-grid{grid-template-columns:1fr}.dish img{height:220px}.kds-grid{grid-template-columns:1fr}.actions .hide-mobile{display:none}}

<body>
  <div id="navScrim" class="nav-scrim" onclick="toggleNav()"></div><div id="app"></div>
  <script>
const KEY='ember_olive_v1';
const seed={restaurant:{name:'Ember & Olive',subtitle:'Woodfire & Wine Bar',location:'Grand St. Flagship',open:true},menu:[
{id:1,name:'Wild Mushroom Pappardelle',category:'Wood-Fired Mains',price:28,description:'House pasta, wild mushrooms, aged parmesan.',available:true,image:'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=80'},
{id:2,name:'Charred Heritage Octopus',category:'Small Plates',price:24,description:'Smoked potato, citrus, herbs, olive oil.',available:true,image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'},
{id:3,name:'Truffled Maitake & Stracciatella',category:'Small Plates',price:28,description:'Roasted maitake, stracciatella, black truffle.',available:true,image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'},
{id:4,name:'Warm Sicilian Olive Oil Cake',category:'Dessert',price:16,description:'Citrus cream, toasted almond, sea salt.',available:true,image:'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=900&q=80'}],
reservations:[{id:201,name:'Sarah Johnson',time:'7:00 PM',guests:4,table:'Table 4',status:'Confirmed',note:'5th Wedding Anniversary'},{id:202,name:'David Kim',time:'7:30 PM',guests:2,table:'Patio Table 2',status:'Confirmed',note:'Outdoor preference'},{id:203,name:'Ananya & Group',time:'8:15 PM',guests:6,table:'Table 8',status:'Confirmed',note:'Pre-ordered tasting menu'}],
orders:[{id:1042,table:'Table 6',guest:'Michael Vance',guests:2,total:142,status:'Preparing',items:['Wild Mushroom Pappardelle','Charred Heritage Octopus']},{id:1043,table:'Bar Counter 3',guest:'Liam S.',guests:4,total:38,status:'Ready',items:['Smoked Rosemary Negroni','Warm Castelvetrano Olives']},{id:1044,table:'Takeout',guest:'Jason Miller',guests:1,total:68.5,status:'Needs Accept',items:['Wild Mushroom Pappardelle','Charred Broccolini']}],
customers:[{name:'Michael Vance',visits:8,spend:942,vip:true,last:'Today'},{name:'Sarah Johnson',visits:5,spend:510,vip:false,last:'Tonight'},{name:'Liam S.',visits:12,spend:1180,vip:true,last:'Today'}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return '$'+Number(v).toFixed(2)}
function path(){return (location.hash.replace(/^#\/?/,'').split('?')[0])||'dashboard'}
function queryParam(name){const q=location.hash.split('?')[1]||'';return new URLSearchParams(q).get(name)||''}
function nav(){return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">EO</div><div><strong>${db.restaurant.name}</strong><span>${db.restaurant.subtitle}</span></div></div><nav class="nav">
${link('dashboard','▦','Dashboard')} ${link('orders','▤','Live Orders',db.orders.length)} ${link('reservations','⌑','Reservations',db.reservations.length)} ${link('menu','☷','Menu & QR')} ${link('customers','♙','Customers')} ${link('website','◩','Website Builder')} ${link('kds','▦','Kitchen Display')}
</nav><div class="sidebar-footer"><a class="nav" href="#/customer" onclick="closeNav()">↗ Customer View</a><a class="nav" href="#/settings" onclick="closeNav()">⚙ Settings</a></div></aside>`}
function link(p,icon,label,badge){return `<a href="#/${p}" onclick="closeNav()" class="${path()===p?'active':''}"><span>${icon}</span><span>${label}</span>${badge?`<span class="badge">${badge}</span>`:''}</a>`}
function shell(title,body,opts={}){if(opts.customer)return body;if(opts.kds)return `<div class="kds">${topbar(title,true)}<main class="content">${body}</main></div>`;return `<div class="app">${nav()}<section class="main">${topbar(title)}<main class="content">${body}</main></section></div>`}
function topbar(title,kds=false){return `<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile-toggle" onclick="toggleNav()">☰</button><div><div class="eyebrow">${kds?'Kitchen Display':'Grand St. Flagship · Live'}</div><h1>${title}</h1></div></div><div class="actions"><button class="btn hide-mobile" onclick="toast('All changes are saved locally for this prototype.')">✓ Saved</button><a class="btn primary" href="#/customer">Customer View ↗</a></div></header>`}
function dashboard(){const revenue=12480, avg=Number((revenue/86).toFixed(0));return shell('Service Command & Pulse',`<div class="grid grid-4"><div class="card kpi"><div class="label">Net sales today</div><div class="value">${money(revenue)}</div><div class="trend">↑ 12.8% vs last Tuesday</div></div><div class="card kpi"><div class="label">Covers</div><div class="value">86</div><div class="muted small">42 dine-in · 8 tables active</div></div><div class="card kpi"><div class="label">Average check</div><div class="value">${money(avg)}</div><div class="trend">↑ 6.4% this week</div></div><div class="card kpi"><div class="label">Reservations</div><div class="value">18</div><div class="muted small">4 VIP · 2 arriving soon</div></div></div><div style="height:16px"></div><div class="grid grid-2"><section class="card"><div class="section-head"><div><h2>Live Tickets & Kitchen</h2><p>Prioritize what needs attention now.</p></div><a class="btn" href="#/orders">View all</a></div><div class="list">${db.orders.map(o=>`<div class="row"><div class="row-main"><div class="row-title">#${o.id} · ${esc(o.table)}</div><div class="row-sub">${esc(o.guest)} · ${o.items.join(' · ')}</div></div><div style="text-align:right"><span class="badge ${o.status==='Ready'?'sage':o.status==='Needs Accept'?'amber':'primary'}">${o.status}</span><div class="small muted" style="margin-top:5px">${money(o.total)}</div></div></div>`).join('')}</div></section><section class="card"><div class="section-head"><div><h2>Tonight's Reservations</h2><p>Next arrivals and table allocation.</p></div><a class="btn" href="#/reservations">Manage</a></div><div class="list">${db.reservations.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.time)} · ${esc(r.name)}</div><div class="row-sub">${r.guests} guests · ${esc(r.table)} · ${esc(r.note)}</div></div><span class="badge sage">${r.status}</span></div>`).join('')}</div></section></div><div style="height:16px"></div><div class="grid grid-3"><section class="card"><div class="section-head"><div><h2>Business Insight</h2><p>Plain-language signal</p></div></div><p style="font-size:13px;line-height:1.7;margin:0">Wood-fired mains are driving <strong>34%</strong> of tonight's sales. Keep the current hero dishes visible on the customer menu.</p></section><section class="card"><div class="section-head"><div><h2>Menu Health</h2><p>Availability</p></div></div><p style="font-size:13px;line-height:1.7;margin:0"><strong>${db.menu.filter(x=>x.available).length}/${db.menu.length}</strong> core dishes are available. Update sold-out items once and they stay synchronized.</p></section><section class="card"><div class="section-head"><div><h2>Guest Pulse</h2><p>Recent feedback</p></div></div><p style="font-size:13px;line-height:1.7;margin:0"><strong>4.8 / 5</strong> average rating. Guests are mentioning the hearth dishes and attentive service most often.</p></section></div>`)}
function orders(){
const f=queryParam('filter');
const filtered=db.orders.filter(o=>f==='dinein'?/^(Table|Bar Counter)/i.test(o.table):f==='online'?/takeout|online|delivery/i.test(o.table):f==='attention'?o.status==='Needs Accept':true);
const tab=(key,label,count)=>`<a class="tab ${f===key||(key==='all'&&!f)?'active':''}" href="#/orders${key==='all'?'':'?filter='+key}">${label}${count!==undefined?' '+count:''}</a>`;
return shell('Live Order Management',`<div class="tabs">${tab('all','All',db.orders.length)}${tab('dinein','Dine-in',db.orders.filter(o=>/^(Table|Bar Counter)/i.test(o.table)).length)}${tab('online','Online',db.orders.filter(o=>/takeout|online|delivery/i.test(o.table)).length)}${tab('attention','Needs attention',db.orders.filter(o=>o.status==='Needs Accept').length)}</div><section class="card"><div class="section-head"><div><h2>Active tickets</h2><p>${f==='dinein'?'Dine-in orders':f==='online'?'Online / takeaway orders':f==='attention'?'Orders needing acceptance':'All active orders'}.</p></div><button class="btn primary" onclick="addOrder()">+ New Order</button></div><div class="table-wrap">${filtered.length?`<table class="data-table"><thead><tr><th>Order</th><th>Guest / Table</th><th>Items</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>${filtered.map(o=>`<tr><td><strong>#${o.id}</strong></td><td>${esc(o.guest)}<br><span class="muted">${esc(o.table)}</span></td><td>${o.items.map(esc).join('<br>')}</td><td><span class="badge ${o.status==='Ready'?'sage':o.status==='Needs Accept'?'amber':'primary'}">${o.status}</span></td><td class="num">${money(o.total)}</td><td><button class="btn" onclick="advanceOrder(${o.id})">Advance</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No orders match this filter yet.</div>`}</div></section>`)}
function reservations(){return shell('Table Reservations',`<div class="grid grid-4"><div class="card kpi"><div class="label">Tonight</div><div class="value">18</div><div class="muted small">42 covers already confirmed</div></div><div class="card kpi"><div class="label">VIP</div><div class="value">4</div><div class="muted small">Flagged for service team</div></div><div class="card kpi"><div class="label">Available</div><div class="value">8</div><div class="muted small">Tables after 8:30 PM</div></div><div class="card kpi"><div class="label">Waitlist</div><div class="value">3</div><div class="muted small">Notify if tables open</div></div></div><div style="height:16px"></div><section class="card"><div class="section-head"><div><h2>Reservation timeline</h2><p>Click a reservation to change its status.</p></div><button class="btn primary" onclick="newReservation()">+ New Reservation</button></div><div class="list">${db.reservations.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.time)} · ${esc(r.name)} · ${r.guests} guests</div><div class="row-sub">${esc(r.table)} · ${esc(r.note)}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge sage">${r.status}</span><button class="btn" onclick="seatReservation(${r.id})">${r.status==='Seated'?'Complete':'Seat'}</button></div></div>`).join('')}</div></section>`)}
function menu(){return shell('Menu & QR Studio',`<div class="section-head"><div><h2 style="font-size:22px">Menu catalog</h2><p>One source of truth for website, QR menu and ordering.</p></div><button class="btn primary" onclick="newDish()">+ Add menu item</button></div><div class="notice" style="margin-bottom:16px"><strong>Sync rule:</strong> changing availability here updates every customer-facing menu view in this prototype.</div><div class="grid grid-2">${db.menu.map(m=>`<section class="card menu-card"><img class="dish-img" src="${m.image}" alt=""><div class="row-main"><div class="row-title">${esc(m.name)}</div><div class="row-sub">${esc(m.category)} · ${money(m.price)}</div><div class="small muted" style="margin-top:5px">${esc(m.description)}</div></div><button class="switch ${m.available?'on':''}" onclick="toggleDish(${m.id})"><span></span></button></section>`).join('')}</div><div style="height:16px"></div><section class="card"><div class="section-head"><div><h2>QR experience</h2><p>Ready for table stands and printed touchpoints.</p></div><button class="btn" onclick="toast('QR link copied: /#/customer')">Copy QR Link</button></div><div class="grid grid-3"><div><div class="label">Public menu</div><strong>emberandolive.example/menu</strong></div><div><div class="label">Table QR</div><strong>24 active touchpoints</strong></div><div><div class="label">Last published</div><strong>Just now</strong></div></div></section>`)}
function customers(){return shell('Customers & VIPs',`<section class="card"><div class="section-head"><div><h2>Guest relationships</h2><p>Useful context without turning the product into a heavy CRM.</p></div><button class="btn primary" onclick="toast('Customer import flow would connect to your backend here.')">Import Guests</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Guest</th><th>Visits</th><th>Lifetime spend</th><th>Last visit</th><th>Segment</th></tr></thead><tbody>${db.customers.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${c.visits}</td><td class="num">${money(c.spend)}</td><td>${esc(c.last)}</td><td>${c.vip?'<span class="badge primary">VIP</span>':'<span class="badge sage">Regular</span>'}</td></tr>`).join('')}</tbody></table></div></section>`)}
function website(){return shell('Website Builder',`<div class="grid grid-2"><section class="card"><div class="section-head"><div><h2>Brand & content</h2><p>Edit the essentials that power the public site.</p></div><button class="btn primary" onclick="toast('Website settings saved')">Publish</button></div><div class="form-grid"><div class="field"><label>Restaurant name</label><input value="${esc(db.restaurant.name)}" onchange="db.restaurant.name=this.value;save();render()"></div><div class="field"><label>Tagline</label><input value="${esc(db.restaurant.subtitle)}" onchange="db.restaurant.subtitle=this.value;save();render()"></div><div class="field" style="grid-column:1/-1"><label>Hero message</label><textarea>Thoughtfully crafted. Beautifully served.</textarea></div></div></section><section class="card"><div class="section-head"><div><h2>Live preview</h2><p>Customer-facing experience</p></div><a class="btn" href="#/customer">Open ↗</a></div><div style="border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#111"><div style="height:250px;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.15)),url('https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1000&q=80') center/cover;padding:28px;color:#fff;display:flex;align-items:flex-end"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em">${esc(db.restaurant.name)}</div><strong style="font-size:26px;display:block;margin-top:8px">Thoughtfully crafted.<br>Beautifully served.</strong></div></div></div></section></div>`)}
function kds(){return shell('Kitchen Display System',`<div class="section-head"><div><h2 style="color:#fff">Dinner service</h2><p style="color:#9b9ba2">High-contrast, glanceable ticket flow.</p></div><div class="badge sage">SERVICE LIVE</div></div><div class="kds-grid">${db.orders.map(o=>`<article class="ticket"><div class="ticket-top"><strong>#${o.id}</strong><span class="badge ${o.status==='Ready'?'sage':o.status==='Needs Accept'?'amber':'primary'}">${o.status}</span></div><h3>${esc(o.table)} · ${esc(o.guest)}</h3><ul>${o.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn ${o.status==='Ready'?'primary':''}" onclick="advanceOrder(${o.id})">${o.status==='Ready'?'Complete Ticket':'Mark Ready'}</button></article>`).join('')}</div>`,{kds:true})}
function customer(){return `<div class="customer-shell"><nav class="customer-nav"><div class="customer-brand">EMBER & OLIVE <span class="muted">· Woodfire & Wine Bar</span></div><div class="customer-links"><a href="#/customer">Home</a><a href="#/customer-menu">Menu</a><a href="#/customer">Story</a><a href="#/customer">Location</a></div><a class="btn primary" href="#/reservations">Reserve a Table</a></nav><section class="hero"><div class="hero-image"><div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Grand St. Flagship · Brooklyn</div><h1>Thoughtfully crafted.<br><em>Beautifully served.</em></h1><p>Modern seasonal dining, crafted with locally inspired ingredients and served over a California white oak hearth.</p><div class="hero-actions"><a class="btn primary" href="#/reservations">Reserve a Table →</a><a class="btn" href="#/customer-menu">View Full Menu</a></div></div></div></section><section class="customer-section"><div class="section-head"><div><div class="eyebrow" style="color:var(--primary)">Artisanal craft</div><h2>Signature Offerings</h2><p class="lead">Daily woodfire creations reflecting harvest cycles and artisanal cellar pairings.</p></div><a class="btn" href="#/customer-menu">Explore Full Menu →</a></div><div class="dish-grid">${db.menu.map(m=>`<article class="dish"><img src="${m.image}" alt="${esc(m.name)}"><div class="dish-body"><span class="badge ${m.available?'sage':'error'}">${m.available?'Available':'Sold Out'}</span><strong style="display:block;margin-top:9px">${esc(m.name)}</strong><p>${esc(m.description)}</p><div class="dish-price">${money(m.price)}</div></div></article>`).join('')}</div></section><section class="customer-section" style="background:#f3efe8;max-width:none"><div style="max-width:1280px;margin:auto"><h2>Rooted in Fire & Living Wine</h2><p class="lead">An intimate neighborhood dining room centered around live fire, seasonal produce and a concise, expressive wine list.</p><div class="grid grid-3" style="margin-top:24px"><div class="card"><strong>100%</strong><div class="small muted">Low-intervention wine</div></div><div class="card"><strong>72-hr</strong><div class="small muted">Wild sourdough</div></div><div class="card"><strong>850°</strong><div class="small muted">White oak hearth</div></div></div></div></section><footer class="customer-section"><div class="grid grid-2"><div><h2>Hours & Location</h2><p class="lead">Grand St. Flagship · Dinner Tue–Sun · 5:30–10:30 PM</p></div><div class="notice">Kitchen advisory: please tell your server about allergies before ordering. Hearth dishes may touch woodfire ember surfaces.</div></div></footer></div>`}
function customerMenu(){return `<div class="customer-shell"><nav class="customer-nav"><div class="customer-brand">EMBER & OLIVE <span class="muted">· Woodfire & Wine Bar</span></div><div class="customer-links"><a href="#/customer">Home</a><a href="#/customer-menu">Menu</a><a href="#/customer">Story</a><a href="#/customer">Location</a></div><a class="btn primary" href="#/reservations">Reserve a Table</a></nav><section class="customer-section"><div class="section-head"><div><div class="eyebrow" style="color:var(--primary)">EMBER & OLIVE</div><h1 style="font-size:38px;letter-spacing:-.04em;margin:0">Full Menu</h1><p class="lead">Seasonal dishes from the woodfire hearth, with each item updated from the restaurant's live menu catalog.</p></div><a class="btn" href="#/customer">← Back to Home</a></div><div class="dish-grid">${db.menu.map(m=>`<article class="dish"><img src="${m.image}" alt="${esc(m.name)}"><div class="dish-body"><span class="badge ${m.available?'sage':'error'}">${m.available?'Available':'Sold Out'}</span><strong style="display:block;margin-top:9px">${esc(m.name)}</strong><p>${esc(m.description)}</p><div class="dish-price">${money(m.price)}</div></div></article>`).join('')}</div></section><section class="customer-section" style="padding-top:10px"><div class="notice">Availability shown here is synchronized with the owner Menu & QR Studio in this prototype.</div></section></div>`}
function settings(){return shell('Settings',`<section class="card"><div class="section-head"><div><h2>Restaurant settings</h2><p>Prototype configuration. Backend/auth comes in the next phase.</p></div></div><div class="form-grid"><div class="field"><label>Restaurant</label><input value="${esc(db.restaurant.name)}"></div><div class="field"><label>Location</label><input value="${esc(db.restaurant.location)}"></div></div><div style="margin-top:18px"><button class="btn" onclick="resetDemo()">Reset demo data</button></div></section>`)}
function render(){const p=path();let html=p==='dashboard'?dashboard():p==='orders'?orders():p==='reservations'?reservations():p==='menu'?menu():p==='customers'?customers():p==='website'?website():p==='kds'?kds():p==='customer'?customer():p==='customer-menu'?customerMenu():settings();document.getElementById('app').innerHTML=html;window.scrollTo(0,0)}
function toggleNav(){const s=document.getElementById('sidebar'),o=s?.classList.toggle('open');document.getElementById('navScrim')?.classList.toggle('open',!!o)}
function closeNav(){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('navScrim')?.classList.remove('open')}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function toggleDish(id){const x=db.menu.find(m=>m.id===id);x.available=!x.available;save();render();toast(`${x.name} is now ${x.available?'available':'sold out'}.`)}
function advanceOrder(id){const o=db.orders.find(x=>x.id===id);const flow=['Needs Accept','Preparing','Ready','Completed'];const i=flow.indexOf(o.status);o.status=flow[Math.min(i+1,flow.length-1)];save();render();toast(`Order #${id}: ${o.status}`)}
function addOrder(){const id=Math.max(...db.orders.map(o=>o.id))+1;db.orders.unshift({id,table:'Table 2',guest:'New Guest',guests:2,total:54,status:'Needs Accept',items:['Wild Mushroom Pappardelle']});save();render();toast('New order created.')}
function seatReservation(id){const r=db.reservations.find(x=>x.id===id);r.status=r.status==='Confirmed'?'Seated':r.status==='Seated'?'Completed':'Completed';save();render();toast(`${r.name}: ${r.status}`)}
function newReservation(){const id=Math.max(...db.reservations.map(r=>r.id))+1;db.reservations.push({id,name:'New Guest',time:'8:45 PM',guests:2,table:'Table 2',status:'Confirmed',note:'New reservation'});save();render();toast('Reservation added.')}
function newDish(){const count=db.menu.filter(m=>m.category==='Chef Selection').length;const id=Math.max(...db.menu.map(m=>m.id))+1;const names=['Seasonal Chef Selection','Charred Garden Plate','Hearthside Special','Market Harvest'];const name=names[Math.min(count,names.length-1)];db.menu.push({id,name,category:'Chef Selection',price:22,description:'A rotating seasonal preparation from the hearth.',available:true,image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80'});save();render();toast(`${name} added to the menu.`)}
function resetDemo(){db=JSON.parse(JSON.stringify(seed));save();render();toast('Demo data reset.')}
window.addEventListener('hashchange',render);render();

</script>
</body>
</html>
